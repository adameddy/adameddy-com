baseURL = 'https://example.org/'
locale = 'en-us'
title = 'AE'
theme = "mana"

[params]
  favicon = "/favicon/favicon.ico"
  heroTitleLine1 = "Adam Eddy"
  heroTitleLine2 = "GigaNerd"
  description = "Avoiding social interaction at all cost"

[params.main.build]
  transpiler = "dartsass"

[params.avatar]
  [params.avatar.home]
    assetPath = "images/logo.png"
  [params.avatar.about]
    assetPath = "images/logo.png"

[params.social]
  github = "https://github.com/yourusername"
  #gitlab = "https://gitlab.com/yourusername"
  linkedin = "https://www.linkedin.com/in/yourprofile"
  #twitter = "yourusername"
  email = "your.email@example.com"

[[menus.main]]
  name = 'Home'
  pageRef = '/'
  weight = 10

[[menus.main]]
  name = 'Posts'
  pageRef = '/posts'
  weight = 20

[[menus.main]]
  name = 'About'
  url = '/about/'
  weight = 40

[pagination]
  pageSize = 10

[markup]
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 6
    ordered = false
  [markup.goldmark]
    [markup.goldmark.parser]
      # Enable block-level attributes for blockquotes
      [markup.goldmark.parser.attribute]
        block = true
        title = true