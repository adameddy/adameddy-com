<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Parallax Star Layers -->
  <div id="stars-small"></div>
  <div id="stars-medium"></div>
  <div id="stars-big"></div>

</body>
</html>

<style>
html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  /*background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);*/
  overflow-x: hidden;
  font-family: sans-serif;
  color: white;
}

/* Base setup for all star layers */
#stars-small, #stars-medium, #stars-big {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  z-index: -1;
}

/* Layer 1: Small Stars (Slowest) */
#stars-small {
  width: 1px;
  height: 1px;
  box-shadow: 
    400px 200px #FFF, 800px 400px #FFF, 1200px 100px #FFF, 
    200px 600px #FFF, 1500px 800px #FFF, 900px 900px #FFF,
    100px 300px #FFF, 600px 700px #FFF, 1300px 500px #FFF;
  animation: moveStars 15s linear infinite;
}

/* Layer 2: Medium Stars (Medium Speed) */
#stars-medium {
  width: 2px;
  height: 2px;
  box-shadow: 
    300px 500px #FFF, 700px 100px #FFF, 1100px 800px #FFF, 
    500px 400px #FFF, 1400px 200px #FFF, 1000px 600px #FFF;
  animation: moveStars 10s linear infinite;
}

/* Layer 3: Big Stars (Fastest) */
#stars-big {
  width: 3px;
  height: 3px;
  box-shadow: 
    100px 800px #FFF, 500px 200px #FFF, 900px 400px #FFF, 
    1300px 700px #FFF;
  animation: moveStars 5s linear infinite;
}

/* Infinite Scrolling Animation */
@keyframes moveStars {
  from {
    transform: translateY(1000px);
  }
  to {
    transform: translateY(-300px);
  }
}
</style>
